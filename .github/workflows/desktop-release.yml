name: Desktop builds and release

on:
  push:
    tags: ["v*"]

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-cua-linux-addon:
    name: Computer Use xa11y (${{ matrix.arch }}, glibc 2.28)
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64
            package_dir: linux-x64-gnu
            binary: xa11y.linux-x64-gnu.node
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64
            package_dir: linux-arm64-gnu
            binary: xa11y.linux-arm64-gnu.node
    steps:
      # 修复：GitHub 托管 runner 已弃用 Node 20 action runtime，官方 action 统一使用 Node 24 主版本。
      - name: Check out locked xa11y source
        uses: actions/checkout@v7
        with:
          repository: xa11y/xa11y
          ref: a3badccf5761615ea3412ee55c19ac3764e27913
          path: xa11y-upstream
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: xa11y-upstream/xa11y-js/package-lock.json
      - name: Verify locked xa11y identity
        working-directory: xa11y-upstream
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "a3badccf5761615ea3412ee55c19ac3764e27913"
          test "$(node -p "require('./xa11y-js/package.json').version")" = "0.15.0"
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - name: Install xa11y Linux build dependencies
        run: dnf install -y libxkbcommon-devel
      - name: Install xa11y JS build dependencies
        working-directory: xa11y-upstream/xa11y-js
        run: npm ci
      - name: Build xa11y N-API addon
        working-directory: xa11y-upstream/xa11y-js
        shell: bash
        run: >-
          npx napi build --platform --release --target ${{ matrix.target }}
          --js native.js --dts native.d.ts
      - name: Assemble and load-test native package
        working-directory: xa11y-upstream/xa11y-js
        shell: bash
        env:
          XA11Y_BINARY: ${{ matrix.binary }}
          XA11Y_PACKAGE_DIR: npm/${{ matrix.package_dir }}
        run: |
          npm run create-npm-dirs
          test -f "$XA11Y_BINARY"
          install -m 0644 "$XA11Y_BINARY" "$XA11Y_PACKAGE_DIR/$XA11Y_BINARY"
          node --input-type=commonjs <<'NODE'
          const assert = require("node:assert/strict");
          const path = require("node:path");
          const packageRoot = path.resolve(process.env.XA11Y_PACKAGE_DIR);
          const packageJson = require(path.join(packageRoot, "package.json"));
          assert.equal(packageJson.version, "0.15.0");
          assert.equal(packageJson.main, process.env.XA11Y_BINARY);
          const binding = require(packageRoot);
          assert.equal(typeof binding.App, "function");
          assert.equal(typeof binding.inputSim, "function");
          NODE
      - name: Upload xa11y native package root
        uses: actions/upload-artifact@v7
        with:
          name: cua-xa11y-linux-${{ matrix.arch }}-gnu
          path: xa11y-upstream/xa11y-js/npm/${{ matrix.package_dir }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    needs: build-cua-linux-addon
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, os: mac, arch: x64 }
          - { runner: macos-15, os: mac, arch: arm64 }
          - { runner: windows-2025, os: win, arch: x64 }
          - { runner: windows-11-vs2026-arm, os: win, arch: arm64 }
          - { runner: ubuntu-24.04, os: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
    env:
      LCODE_ENV: production
      # tag 构建自动同步 Agent/worker，但不能通过重生成掩盖已提交声明过期。
      LCODE_VERIFY_RELEASE_INPUTS: "1"
      LCODE_TARGET_OS: ${{ matrix.os }}
      LCODE_TARGET_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      LCODE_ENABLE_MAC_SIGN: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.6
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Check release version
        id: version
        run: node scripts/verify-release-version.mjs
      - name: Verify committed release notice baseline
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        run: >-
          node --input-type=module -e "import { readReleaseVerifiedNotices } from './scripts/third-party-notices.mjs';
          await readReleaseVerifiedNotices(process.cwd())"
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools fakeroot ruby-dev xz-utils
          sudo gem install fpm --no-document
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore committed release input after install
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        shell: bash
        run: |
          git diff -- pnpm-lock.yaml
          git restore --source=HEAD -- pnpm-lock.yaml
      - name: Verify release contract
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        run: pnpm test:release
      - name: Verify dependency security and source checks
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        run: |
          pnpm test:dependency-security
          pnpm test:remote-control
          pnpm typecheck
          pnpm lint
          pnpm --dir apps/lcode-cli typecheck
          pnpm --dir apps/lcode-cli lint
          pnpm architecture:check
      - name: Download Linux Computer Use xa11y addon
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v8
        with:
          name: cua-xa11y-linux-${{ matrix.arch }}-gnu
          path: .release-inputs/xa11y-native
      - name: Configure Linux Computer Use native package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          native_root="$(realpath .release-inputs/xa11y-native)"
          test -f "$native_root/package.json"
          echo "LCODE_CUA_LINUX_XA11Y_NATIVE_ROOT=$native_root" >> "$GITHUB_ENV"
      - name: Configure macOS Computer Use SEA runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node_executable="$(node -p 'process.execPath')"
          node_version="$(node -p 'process.versions.node')"
          node_sha256="$(shasum -a 256 "$node_executable" | awk '{print $1}')"
          {
            echo "LCODE_CUA_MAC_NODE_EXECUTABLE=$node_executable"
            echo "LCODE_CUA_MAC_NODE_VERSION=$node_version"
            echo "LCODE_CUA_MAC_NODE_SHA256=$node_sha256"
            echo "LCODE_CUA_HELPER_BUILD_ID=$GITHUB_SHA:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"
      - name: Package and verify desktop app identity
        run: pnpm bundle:desktop -- --os ${{ matrix.os }} --arch ${{ matrix.arch }}
      - name: Stage versioned installers
        run: node scripts/stage-release-artifacts.mjs ${{ steps.version.outputs.version }} ${{ matrix.os }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: packages/desktop/dist/release-assets/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  remote-assets:
    name: Remote workspace runtimes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      LCODE_ENV: production
      LCODE_VERIFY_RELEASE_INPUTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.6
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Check release version
        run: node scripts/verify-release-version.mjs
      - name: Verify committed release notice baseline
        run: >-
          node --input-type=module -e "import { readReleaseVerifiedNotices } from './scripts/third-party-notices.mjs';
          await readReleaseVerifiedNotices(process.cwd())"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore committed release input after install
        shell: bash
        run: |
          git diff -- pnpm-lock.yaml
          git restore --source=HEAD -- pnpm-lock.yaml
      - name: Verify remote resource distribution
        run: pnpm test:remote-assets
      # 修复：桌面打包只准备本机资产，远端 manifest / components 必须独立构建并一起发布。
      - name: Build and stage remote runtimes
        run: pnpm build:remote-release
      - uses: actions/upload-artifact@v7
        with:
          name: remote-runtime-assets
          path: packages/desktop/dist/remote-release-assets/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [build, remote-assets]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.6
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Check release version
        id: version
        run: node scripts/verify-release-version.mjs
      # 修复：release 是独立 job，不继承 build 的 node_modules；产物校验脚本直接依赖 yaml。
      - name: Install release verification dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: remote-runtime-assets
          path: release-assets
      - name: Verify all six platform packages
        run: node scripts/stage-release-artifacts.mjs ${{ steps.version.outputs.version }} --verify-collected
      - name: Verify release notice baseline
        run: >-
          node --input-type=module -e "import { readReleaseVerifiedNotices } from './scripts/third-party-notices.mjs';
          await readReleaseVerifiedNotices(process.cwd())"
      - name: Upload installers to release draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || '' }}
          RELEASE_TARGET_REPO: ${{ vars.RELEASE_TARGET_REPO || '' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git log -1 --format=%B HEAD > release-notes.md
          cat >> release-notes.md <<'EOF'

          ---
          Unsigned desktop packages for macOS, Windows, and Linux (x64 and arm64). Sign them locally if your environment requires it.
          EOF
          # 目标仓库与 TOKEN 同时配置才跨仓库发布；缺一则保留本仓库语义（--verify-tag + github.token）。
          repo_flags=()
          create_flags=(--verify-tag)
          if [ -n "$RELEASE_TARGET_REPO" ] && [ -n "$RELEASE_TOKEN" ]; then
            repo_flags=(-R "$RELEASE_TARGET_REPO")
            create_flags=()
          fi
          if ! gh release view "${repo_flags[@]}" "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "${repo_flags[@]}" "${create_flags[@]}" "$GITHUB_REF_NAME" --draft \
              --title "LCode $VERSION" \
              --notes-file release-notes.md
          else
            gh release edit "${repo_flags[@]}" "$GITHUB_REF_NAME" \
              --title "LCode $VERSION" \
              --notes-file release-notes.md
          fi
          gh release upload "${repo_flags[@]}" "$GITHUB_REF_NAME" release-assets/* --clobber
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || '' }}
          RELEASE_TARGET_REPO: ${{ vars.RELEASE_TARGET_REPO || '' }}
        run: |
          repo_flags=()
          if [ -n "$RELEASE_TARGET_REPO" ] && [ -n "$RELEASE_TOKEN" ]; then
            repo_flags=(-R "$RELEASE_TARGET_REPO")
          fi
          gh release edit "${repo_flags[@]}" "$GITHUB_REF_NAME" --draft=false
