packages:
  - packages/*
  - apps/lcode-cli
  - apps/lcode-cli/packages/*
  - apps/lcode-cli/tools/*
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
allowBuilds:
  cpu-features: true
  edgedriver: true
  electron: true
  electron-winstaller: true
  esbuild: true
  geckodriver: true
  koffi: true
  msw: true
  node-pty: true
  protobufjs: true
  ssh2: true
  unsafe-pointer: true
# pnpm 10+ 不再读取 package.json 的 "pnpm" 字段,overrides 与 patchedDependencies
# 统一迁移到本文件(值与 pnpm-lock.yaml 顶部记录保持一致)。
overrides:
  react: 19.2.7
  react-dom: 19.2.7
patchedDependencies:
  '@arms/rum-electron@0.0.3': patches/@arms__rum-electron@0.0.3.patch
  '@ai-sdk/openai-compatible@2.0.60': patches/@ai-sdk__openai-compatible@2.0.60.patch
  '@ai-sdk/anthropic@3.0.81': patches/@ai-sdk__anthropic@3.0.81.patch
