<!doctype html>
<html lang="zh-CN" class="dark theme-zai-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Settings Regression Fixture</title>
    <style>
      body {
        margin: 0;
      }
      .fixture-page {
        max-width: 880px;
        margin: 0 auto;
        padding: 24px;
        min-width: 0;
        /* 应用根背景允许 Electron 透明；浏览器夹具复用 Web shell 的实色背景。 */
        background: var(--color-background-win-alt);
      }
      .fixture-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 16px 0;
      }
      .fixture-controls label {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }
      .fixture-controls select {
        max-width: 100%;
        padding: 6px;
        background: var(--color-input);
        border: 1px solid var(--color-input-border);
        border-radius: 4px;
      }
      .fixture-state {
        display: flex;
        gap: 12px;
        border-block: 1px solid var(--color-border);
        padding: 16px 0;
        margin-bottom: 20px;
      }
      @media (max-width: 480px) {
        .fixture-page {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body class="bg-background-alt text-foreground">
    <div id="root"></div>
    <script type="module" src="./memory-settings.tsx"></script>
  </body>
</html>
