    <title>LCode</title>
    <script>
      (() => {
        // JS bundle 执行前先按本地主题偏好决定首屏底色，避免深色用户在这一帧看到白底闪烁。
        const STORAGE_KEY = "lcode-theme";
        const DEFAULT_THEME = "zai-dark";
        const BROWSER_THEME_COLORS = {
          dark: "#161616",
          light: "#f8f8f8",
        };
        // 主题 id → 明暗基底：与 useTheme.ts 的 THEME_OPTIONS 注册表手工同步
        // （内联脚本无法 import 共享模块，新增主题必须同步此处）。
        const THEME_BASES = {
          "zai-light": "light",
          "zai-dark": "dark",
          "sepia-light": "light",
          "midnight-blue": "dark",
          "forest-dark": "dark",
        };

        const syncBrowserThemeSurface = (theme) => {
          document.documentElement.setAttribute("data-lcode-browser-theme-surface", theme);
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", BROWSER_THEME_COLORS[theme]);
          document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", theme);
        };

        // 按归一后的激活主题挂 class：深基底挂 dark + theme-<id>，浅基底只挂 theme-<id>，
        // 让 styles.css 加载后首帧即呈现新主题差量色，而不是基底色再跳变。
        const applyBootstrapTheme = (themeId) => {
          const base = THEME_BASES[themeId] || THEME_BASES[DEFAULT_THEME];
          document.documentElement.setAttribute("data-lcode-bootstrap-theme", base);
          syncBrowserThemeSurface(base);
          document.documentElement.classList.toggle("dark", base === "dark");
          for (const id of Object.keys(THEME_BASES)) {
            document.documentElement.classList.toggle(`theme-${id}`, id === themeId);
          }
        };

        try {
          const saved =
            localStorage.getItem(STORAGE_KEY) ||
            // 旧键兼容读：老用户主题偏好存于 zcode-theme。
            localStorage.getItem("zcode-theme") ||
            DEFAULT_THEME;
          const themeId =
            saved === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "zai-dark"
                : "zai-light"
              : saved === "dark"
                ? "zai-dark"
                : saved === "light"
                  ? "zai-light"
                  : THEME_BASES[saved]
                    ? saved
                    : DEFAULT_THEME;
          applyBootstrapTheme(themeId);
        } catch {
          applyBootstrapTheme(DEFAULT_THEME);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--lcode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--lcode-bootstrap-fg, var(--color-foreground, #e2e8f0));
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html[data-lcode-bootstrap-theme="light"] body {
        background: var(--lcode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--lcode-bootstrap-fg, var(--color-foreground, #334155));
      }

      html[data-lcode-browser-theme-surface],
      html[data-lcode-browser-theme-surface] body,
      html[data-lcode-browser-theme-surface] #root {
        /* 共享 UI 样式为 Electron vibrancy 强制透明根背景；浏览器入口必须用语义背景
           覆盖该桌面专属行为，否则浏览器工具栏、overscroll 和页面画布会回退为系统白色。 */
        background: var(--color-background, var(--lcode-bootstrap-bg, #161616)) !important;
      }

      html[data-lcode-browser-theme-surface="light"],
      html[data-lcode-browser-theme-surface="light"] body,
      html[data-lcode-browser-theme-surface="light"] #root {
        background: var(--color-background, var(--lcode-bootstrap-bg, #f8f8f8)) !important;
      }

      .lcode-boot-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        /* UI 全局样式会把 body/#root 置为透明，预渲染壳必须自己承接主题背景，否则深色主题会露出浏览器白底。*/
        background: var(--lcode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--lcode-bootstrap-fg, var(--color-foreground, #e2e8f0));
      }

      html[data-lcode-bootstrap-theme="light"] .lcode-boot-loading {
        background: var(--lcode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--lcode-bootstrap-fg, var(--color-foreground, #334155));
      }

      .lcode-boot-loading__logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: linear-gradient(180deg, #000000 0%, #151718 100%);
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.2),
          0 8px 10px -6px rgb(0 0 0 / 0.2);
      }

      .lcode-boot-loading__logo-shell::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        /* 启动 logo 壳是固定深色底，边框不能跟随浅色主题 token，否则首屏边框过重。*/
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
      }

      .lcode-boot-loading__logo {
        width: 56px;
        height: auto;
        color: #ffffff;
      }
    </style>
  </head>
