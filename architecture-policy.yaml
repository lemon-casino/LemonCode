version: 1

# 存量模块先标记为 legacy；新模块或完成迁移的模块设置 managed: true。
modules:
  - id: rpc
    roots: [packages/rpc/src]
    managed: false
  - id: shared
    roots: [packages/shared/src]
    managed: false
  - id: provider
    roots: [packages/provider/src]
    managed: false
  - id: provider-node
    roots: [packages/provider-node/src]
    managed: false
    requires: [provider, shared]
    publicEntrypoints: [packages/provider-node/src/index.ts, packages/provider-node/src/network.ts]
  - id: services
    roots: [packages/services/src]
    managed: false
  - id: worktree
    # Existing worktree owner.
    roots: [packages/services/src/worktree]
    managed: true
    requires: [shared, services]
    publicEntrypoints:
      [packages/services/src/worktree/contract.ts, packages/services/src/worktree/node.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: workspace-execution
  - id: sidebar-organization
    roots: [packages/services/src/sidebar-organization]
    managed: true
    requires: [shared, services, rpc]
    publicEntrypoints:
      [
        packages/services/src/sidebar-organization/contract.ts,
        packages/services/src/sidebar-organization/node.ts,
      ]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: sidebar-navigation
  - id: project-execution-set
    roots: [packages/services/src/project-execution-set]
    managed: true
    requires: [shared, services, worktree, rpc]
    publicEntrypoints:
      [packages/services/src/project-execution-set/contract.ts, packages/services/src/project-execution-set/node.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: workspace-execution
  - id: runtime-environment
    roots: [packages/services/src/runtime-environment]
    managed: true
    requires: [shared, rpc, services, worktree]
    publicEntrypoints:
      [
        packages/services/src/runtime-environment/contract.ts,
        packages/services/src/runtime-environment/node.ts,
      ]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: workspace-execution
  - id: session
    roots: [packages/services/src/session]
    managed: false
    requires: [shared]
    publicEntrypoints: [packages/services/src/session/contract.ts]
    owner: conversation
  - id: storage
    roots: [packages/services/src/storage]
    managed: true
    requires: [shared, rpc, services]
    publicEntrypoints: [packages/services/src/storage/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: desktop-settings
  - id: client
    roots: [packages/client/src]
    managed: false
  - id: server
    roots: [packages/server/src]
    managed: false
  - id: lcode-server-cli
    roots: [packages/lcode-server-cli/src]
    managed: false
  - id: ui
    roots: [packages/ui/src]
    managed: false
  - id: web
    roots: [packages/web/src]
    managed: false
  - id: desktop
    roots: [packages/desktop/src]
    managed: false
  - id: formal-proof
    roots: [packages/formal-proof/src]
    managed: false
  - id: lcode-cli
    roots: [apps/lcode-cli]
    managed: false
    requires: [provider, provider-node, shared]

global:
  maxFileLines: 400
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true

exceptions: []
